name: Publish Enraged Eggplant Monster Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer package version, for example 0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_TAG: monster-library-v${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run review:verify
      - name: Build approval-gated package
        run: npm run promote:enraged-eggplant -- --version "$VERSION"
      - name: Build web thumbnails
        run: |
          pip install pillow
          python scripts/build-web-thumbnails.py --input-dir art/enraged-eggplant/portraits --output-dir art/enraged-eggplant/thumbs
      - name: Upload art to public R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/upload-art-to-r2.mjs
      - name: Advance the stable package pointer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add converted/doa-monsters.json packages/latest/manifest.json
          git commit -m "Publish Enraged Eggplant monster package ${VERSION}"
          git push
      - name: Create source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          "converted/doa-monsters.json#Enraged Eggplant Monster Library ${VERSION}"
          --title "Enraged Eggplant Monster Library ${VERSION}"
          --notes "Approval-gated source artifact for mirroring to the public site. Art is published to the assets.dungeonsonautomatic.com R2 bucket."
      # Optional convenience only. Without DOA_SITE_MONSTER_DISPATCH_TOKEN the
      # release above is still complete, and the site's "Mirror Public Monster
      # Package" workflow can be run manually with the release tag. Do not fail a
      # finished publish because the notification could not be sent.
      - name: Ask public site to mirror the package
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DOA_SITE_MONSTER_DISPATCH_TOKEN }}
        run: >-
          gh api repos/Zuljita/DungeonsOnAutomaticSite/dispatches
          --method POST
          --field event_type=monster_package_published
          --field "client_payload[source_tag]=$RELEASE_TAG"
          --field "client_payload[asset_name]=doa-monsters.json"
