name: Publish Monster Library Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer package version, for example 0.5.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_TAG: monster-library-v${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run review:verify
      # The GCS sheets embed each monster's web thumbnail as its portrait, and
      # the thumbnails are generated rather than tracked, so they must exist
      # before the sheets are checked against what is committed.
      - name: Verify the image manifests against R2
        # Art is published from the authoring machine (npm run art:thumbnails,
        # art:*:hex-tokens, art:upload) — never from CI, which has no pixels.
        # A package must not ship pointing at art that is not there.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run verify:art:r2 -- --require-credentials
      - run: npm run validate:gcs-sheets
      - name: Build approval-gated library package
        run: npm run promote:library -- --version "$VERSION"
      - name: Build Foundry VTT module
        run: |
          node scripts/build-foundry-module.mjs --pack --zip --update-latest-manifest
          mkdir -p dist/foundry/release
          cp "dist/foundry/dungeons-on-automatic-monsters/module.json" dist/foundry/release/
          cp "dist/foundry/dungeons-on-automatic-monsters-${VERSION}.zip" dist/foundry/release/
          sha256sum "dist/foundry/release/dungeons-on-automatic-monsters-${VERSION}.zip"
      - name: Upload GCS templates and sheets to public R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/upload-art-to-r2.mjs --art-dir converted/enraged-eggplant/gcs --prefix monsters/enraged-eggplant/gct --flat --attachment --force
          node scripts/upload-art-to-r2.mjs --art-dir converted/enraged-eggplant/gcs-sheets --prefix monsters/enraged-eggplant/gcs --flat --attachment --force
          node scripts/upload-art-to-r2.mjs --art-dir converted/srd-monsters/gcs --prefix monsters/srd-monsters/gct --flat --attachment --force
          node scripts/upload-art-to-r2.mjs --art-dir converted/srd-monsters/gcs-sheets --prefix monsters/srd-monsters/gcs --flat --attachment --force
      - name: Upload Foundry module manifest and download to public R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        # module.json must NOT be an attachment: Foundry's installer fetches it
        # inline from the stable manifest URL.
        run: node scripts/upload-art-to-r2.mjs --art-dir dist/foundry/release --prefix monsters/enraged-eggplant/foundry --flat --force
      - name: Upload library image manifest to public R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        # Inline, not an attachment: consumers fetch it from the stable
        # manifest URL the package's manifest.art.manifestUrl states.
        run: |
          mkdir -p dist/library-manifest
          cp converted/library-image-manifest.json dist/library-manifest/image-manifest.json
          node scripts/upload-art-to-r2.mjs --art-dir dist/library-manifest --prefix monsters --flat --force
      - name: Advance the stable package pointer
        # The pointer may already be where this publish would put it: a branch
        # can regenerate the artifacts itself so the change is reviewable before
        # release. Committing nothing is then the correct outcome, and `git
        # commit` exits non-zero on an empty index — which would fail the run
        # after every upload had succeeded and before the release was created.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add converted/doa-monsters.json converted/library-image-manifest.json packages/latest/manifest.json
          if git diff --cached --quiet; then
            echo "Package artifacts already match ${VERSION}; pointer left as committed."
          else
            git commit -m "Publish monster library package ${VERSION}"
            git push
          fi
      - name: Create source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          "converted/doa-monsters.json#Dungeons on Automatic Monster Library ${VERSION}"
          "dist/foundry/release/dungeons-on-automatic-monsters-${VERSION}.zip#Foundry VTT module ${VERSION} (GURPS Game Aid)"
          "dist/foundry/release/module.json#Foundry VTT module manifest ${VERSION}"
          --title "Dungeons on Automatic Monster Library ${VERSION}"
          --notes "Approval-gated source artifact for mirroring to the public site. Art is published to the assets.dungeonsonautomatic.com R2 bucket."
      # Fast path only. The site also polls this repo's latest release hourly and
      # mirrors what it finds, so a publish reaches the site with or without this
      # step. Never fail a finished publish because the notification could not be
      # sent — but never report success for a notification that was not sent
      # either. That is how 0.3.1 and 0.3.2 both published while the site sat on
      # 0.2.3: DOA_SITE_MONSTER_DISPATCH_TOKEN does not exist, gh refused to run
      # with an empty GH_TOKEN, and continue-on-error rendered the step green.
      - name: Ask public site to mirror the package
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DOA_SITE_MONSTER_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning title=Site not notified::DOA_SITE_MONSTER_DISPATCH_TOKEN is not set, so the site was not told about $RELEASE_TAG. Its hourly mirror will pick this up within the hour; run the site's Mirror Public Monster Package workflow to publish sooner."
            exit 0
          fi
          gh api repos/Zuljita/DungeonsOnAutomaticSite/dispatches \
            --method POST \
            --field event_type=monster_package_published \
            --field "client_payload[source_tag]=$RELEASE_TAG" \
            --field "client_payload[asset_name]=doa-monsters.json"
          echo "Notified the public site to mirror $RELEASE_TAG."
