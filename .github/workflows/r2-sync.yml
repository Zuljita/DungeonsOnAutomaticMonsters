# Keep the R2 bucket's policy in step with the repository, and prove the bucket
# holds what the image manifests say — without minting a package release.
#
# Art bytes are not in git any more (see README "Where the art lives"): they are
# uploaded from the authoring machine with `npm run art:upload` after the
# thumbnails and hex tokens are built there. CI has no pixels, so this workflow
# no longer builds or uploads art; it applies the bucket's CORS policy and runs
# the manifest ↔ R2 verifier so a missing or mismatched object is reported
# before the publish workflow (which fails on it) ever runs.
#
# CORS matters because the site draws an optional facing bar on hex tokens and
# offers the marked token as a download; building that file means reading the
# PNG into a canvas, which a browser refuses cross-origin unless the bucket
# says otherwise.
name: Sync CORS and verify art on R2

on:
  workflow_dispatch:
    inputs:
      set_cors:
        description: Apply scripts/r2-cors.json to the bucket
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply CORS policy
        if: ${{ inputs.set_cors }}
        run: npx --yes wrangler@4 r2 bucket cors set doa-assets --file scripts/r2-cors.json --force
      - name: Verify the image manifests against R2
        run: npm run verify:art:r2 -- --require-credentials
